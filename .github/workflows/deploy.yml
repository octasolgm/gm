name: Deploy Portfolio

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  VITE_API_URL: https://api.gmrehman.com/api
  FTP_HOST: ftp.gmrehman.com
  FTP_PORT: 21

jobs:
  deploy-web:
    name: Deploy website (gmrehman.com)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:web
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || env.VITE_API_URL }}

      - name: Deploy to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_WEB_USERNAME }}
          password: ${{ secrets.FTP_WEB_PASSWORD }}
          port: ${{ env.FTP_PORT }}
          protocol: ftps
          local-dir: ./apps/web/dist/
          server-dir: ${{ secrets.FTP_WEB_DIR || '/public_html/' }}
          dangerous-clean-slate: false

  deploy-api:
    name: Deploy API (api.gmrehman.com)
    runs-on: ubuntu-latest
    needs: deploy-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: |
          npm run db:generate
          npm run build:api

      - name: Prepare API bundle
        run: |
          mkdir -p release/api-bundle
          cp -r apps/api/dist release/api-bundle/dist
          cp -r apps/api/prisma release/api-bundle/prisma
          cp apps/api/package.json release/api-bundle/package.json

      - name: Deploy API files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_API_USERNAME }}
          password: ${{ secrets.FTP_API_PASSWORD }}
          port: ${{ env.FTP_PORT }}
          protocol: ftps
          local-dir: ./release/api-bundle/
          server-dir: ${{ secrets.FTP_API_DIR || '/api/apps/api/' }}
          dangerous-clean-slate: false
